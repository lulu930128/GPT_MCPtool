<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>聽力音檔下載測試</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText)}
body{margin:0;padding:20px;max-width:640px}h1{font-size:18px;margin:0 0 8px}p{line-height:1.6;margin:8px 0;overflow-wrap:anywhere}button{font:inherit;padding:10px 18px;border:1px solid currentColor;border-radius:8px;background:#285c83;color:white;cursor:pointer}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:3px solid #68a4d2;outline-offset:3px}small{color:var(--color-text-secondary,GrayText)}details{margin-top:18px;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<h1 id="title">聽力音檔下載測試</h1>
<p id="file">等待題目資料。</p>
<button id="download" disabled>下載音檔</button>
<p id="status" role="status" aria-live="polite">正在連接 ChatGPT…</p>
<small>下載位置由瀏覽器決定。這個測試不會重新產生音檔。</small>
<details><summary>測試狀態</summary><pre id="diagnostics"></pre></details>

</body></html>
