name: 功能提案
description: 提議符合既有元件與 trust boundary 的改善
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        請先描述要解決的問題，而不只是指定實作。大型變更必須保留元件 ownership、資料安全與可驗證性。
  - type: dropdown
    id: component
    attributes:
      label: 主要元件
      options:
        - OMI_search
        - Memory Core
        - japanese_study
        - project_reading
        - codex_bridge
        - personal-asset-os
        - mcp_control_center
        - Workspace / repository
        - 跨元件
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題
      description: 誰遇到什麼限制？目前 workaround 與成本是什麼？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望 outcome
      description: 描述可觀察、可驗證的完成狀態。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方向
      description: 若已有想法，請說明介面、流程與相容策略；不必先提供完整實作。
  - type: textarea
    id: boundaries
    attributes:
      label: 邊界與風險
      description: 說明資料 owner、secret／privacy、write authority、runtime lifecycle、migration 或 breaking-change 影響。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
      description: 包含不做、使用既有工具或較小範圍方案。
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 確認
      options:
        - label: 我已閱讀目標元件的 README 與相關文件。
          required: true
        - label: 提案不要求把 secret、私人資料或正式 runtime state 放進 Git。
          required: true
