name: 錯誤回報
description: 回報目前 main 可安全重現的錯誤或 contract 偏差
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感謝協助改善專案。這是 public repository；請只使用 synthetic 資料，勿貼 secret、私人路徑、tunnel identity、資料庫或正式 log。
  - type: dropdown
    id: component
    attributes:
      label: 受影響元件
      options:
        - OMI_search
        - Memory Core
        - japanese_study
        - project_reading
        - codex_bridge
        - personal-asset-os
        - mcp_control_center
        - Workspace / repository
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: 版本或 commit
      description: 請提供 commit SHA、tag 或明確版本；不要只寫最新版。
      placeholder: 例如 8d190ba
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: 實際行為
      description: 說明觀察到什麼，以及錯誤如何影響正確性、安全、資料或操作。
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: 預期行為
      description: 請引用相關 README、contract 或測試依據。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小重現步驟
      description: 使用 synthetic 值列出可重複步驟、命令與必要前置條件。
      placeholder: |
        1. 使用設定 ...
        2. 執行命令 ...
        3. 觀察結果 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: Windows、Python／Node／PowerShell 版本與必要 dependency；請移除使用者名稱及私人路徑。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 最小診斷證據
      description: 僅貼已去識別的短 log、error 或 smoke 結果；不要貼完整 dump。
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: 公開安全確認
      options:
        - label: 我已搜尋既有 issue，並確認這不是重複回報。
          required: true
        - label: 我已移除 secret、私人資料、公司資訊、實際 endpoint 與本機識別值。
          required: true
        - label: 這不是需要私密處理的安全漏洞；若是，我會改依 SECURITY.md 回報。
          required: true
