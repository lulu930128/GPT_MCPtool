[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-asset-os"
version = "1.1.0"
description = "Local-first personal asset ledger and reconciliation system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "mcp>=2,<3",
    "openai>=2,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]

[project.scripts]
personal-asset-os = "personal_asset_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".test-tmp", ".test-tmp-system", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["personal_asset_os"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
